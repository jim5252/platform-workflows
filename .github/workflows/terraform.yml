# Owned by the platform team. Product teams call this instead of writing
# their own pipeline, so every team gets the same checks and controls.
name: terraform

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      aws-region:
        type: string
        default: eu-west-2
      plan-role-arn:
        type: string
        required: true
      apply-role-arn:
        type: string
        required: true
      terraform-version:
        type: string
        default: "1.16.4"

# Platform baseline: public access blocked, versioning on, KMS encryption.
env:
  CHECKOV_CHECKS: CKV_AWS_53,CKV_AWS_54,CKV_AWS_55,CKV_AWS_56,CKV2_AWS_6,CKV_AWS_21,CKV_AWS_145

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Security baseline (Checkov)
        working-directory: ${{ inputs.working-directory }}
        run: |
          pip install --quiet checkov==3.3.19
          checkov -d . --framework terraform --check "$CHECKOV_CHECKS" --compact --quiet

  plan:
    name: plan
    if: github.event_name == 'pull_request'
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # lets the job request an OIDC token
      pull-requests: write   # lets the job comment the plan on the PR
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.plan-role-arn }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -out=tfplan
      - run: terraform show -no-color tfplan > plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_PATH: ${{ inputs.working-directory }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(process.env.PLAN_PATH, 'utf8');
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['See run log'])[0];
            const body = [
              '### Terraform plan',
              `**${summary}**`,
              '<details><summary>Full plan</summary>',
              '',
              '```',
              plan.slice(0, 60000),
              '```',
              '</details>',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });

  apply:
    name: apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: policy
    runs-on: ubuntu-latest
    environment: production  # required reviewer approval happens here
    concurrency:
      group: terraform-apply-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.apply-role-arn }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve
